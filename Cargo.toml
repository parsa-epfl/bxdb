[package]
name = "bxdb"
version = "0.1.0"
edition = "2024"

[lib]
name = "bxdb"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "bxdb-convert"
path = "src/bin/bxdb_convert.rs"

[[bin]]
name = "bxdb-inspect"
path = "src/bin/bxdb_inspect.rs"
required-features = ["inspect"]

[features]
default = []
inspect = ["dep:ratatui", "dep:crossterm"]

[dependencies]
zstd = "0.13"
rustc-hash = "2"
rayon = "1"
parking_lot = "0.12"
libc = "0.2"
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[dev-dependencies]
tempfile = "3"
rand = "0.8"
